<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Gold coin -->
  <circle cx="256" cy="256" r="180" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#D97706" stroke-width="3" opacity="0.4"/>
  <!-- R&A text - centered -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="120" fill="#1E3A5F" letter-spacing="-2">R&amp;A</text>
</svg>
